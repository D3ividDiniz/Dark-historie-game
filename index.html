<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arquivo Confidencial #01 - Noir Mystery TV</title>
    
    <meta name="theme-color" content="#1a1a1a"> <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="color-scheme" content="dark"> <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* === PALETA AMBIENTE NOIR E TEXTURAS REALISTAS === */
        :root {
            --desk-bg: #1a1a1a; /* Mahogany/Noir escurecido */
            --desk-textured: #2c1a12;
            --tv-casing: #3a1e0b; /* Bakelite casing */
            --metal-chrome: #ccc;
            --screen-amber: #f8c255; /* Fósforo âmbar em luminescência */
            --text-ink: #2b1706; /* Tinta marrom escuro nas placas */
            --paper: #eee;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier Prime', monospace; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--desk-bg);
            background-image: linear-gradient(to bottom, #111 0%, #000 60%, var(--desk-textured) 60%, #000 100%);
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden; position: relative;
        }

        /* Iluminação ambiente vinda da TV (Garante escuridão total nos cantos do sistema) */
        .ambient-glow {
            position: absolute; top: 50%; left: 50%;
            width: 100vw; height: 100vh;
            transform: translate(-50%, -50%);
            background: radial-gradient(ellipse at center, rgba(231, 111, 81, 0.08) 0%, transparent 80%);
            pointer-events: none; z-index: 1;
        }

        /* === MODELO DA TV HYPER-REALISTA (3D SKEUOMORPHISM) === */
        .tv-model {
            position: relative;
            width: 95vw; max-width: 550px;
            aspect-ratio: 4 / 3;
            background: linear-gradient(135deg, var(--tv-casing) 0%, #111 100%);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 
                0 30px 40px rgba(0,0,0,0.8), 
                0 10px 20px rgba(0,0,0,0.6),
                inset 2px 2px 3px rgba(255,255,255,0.1),
                inset -5px -5px 15px rgba(0,0,0,0.8);
            display: flex; gap: 15px;
            z-index: 10;
        }

        /* Antenas Rabbit-Ear Metalizadas */
        .tv-model::before {
            content: ''; position: absolute; top: -50px; left: 30%;
            width: 4px; height: 70px; background: var(--metal-chrome);
            transform: rotate(-30deg); z-index: -1;
            box-shadow: 50px 10px 0 var(--metal-chrome);
        }

        /* Moldura de plástico escuro ao redor da tela */
        .tv-screen-bezel {
            flex: 1;
            background: #111;
            border-radius: 20px 20px 30px 30px;
            padding: 12px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.9), 1px 1px 2px rgba(255,255,255,0.1);
            position: relative;
        }

        /* O Vidro Curvo da Tela (CRT) */
        .tv-crt-glass {
            width: 100%; height: 100%;
            background: radial-gradient(circle at center, var(--screen-amber) 0%, var(--screen-amber-edge) 100%);
            border-radius: 25% / 15%; /* Curvatura realista clássica */
            position: relative; overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.95);
            cursor: pointer;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 25px 30px;
        }

        /* Reflexo realista do vidro (3D Skeuomorphism) */
        .tv-crt-glass::after {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0) 40%);
            pointer-events: none; z-index: 10;
        }
        
        /* Scanlines da TV Antiga */
        .scanlines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px;
            pointer-events: none; z-index: 5;
        }

        /* Efeito Ruído ao trocar */
        #static-noise {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0; z-index: 20; pointer-events: none;
            filter: contrast(200%) brightness(150%);
        }
        #static-noise.active { opacity: 0.6; animation: noiseTwitch 0.1s infinite; }
        @keyframes noiseTwitch { 0% { background-position: 0 0; } 100% { background-position: 15px 15px; } }

        /* Painel Lateral (Knobs prateados) */
        .tv-panel {
            width: 50px; display: flex; flex-direction: column; gap: 15px; align-items: center; padding-top: 20px;
        }
        .knob {
            width: 35px; height: 35px; border-radius: 50%;
            background: radial-gradient(circle at top left, var(--metal-chrome), #666);
            box-shadow: 2px 2px 5px rgba(0,0,0,0.8), inset -1px -1px 2px rgba(255,255,255,0.2);
            position: relative;
        }
        .knob::after {
            content: ''; position: absolute; top: 5px; left: 50%;
            width: 2px; height: 12px; background: #333; transform: translateX(-50%);
        }
        .speaker-grill {
            flex: 1; width: 30px; margin-top: 10px; margin-bottom: 10px;
            background: repeating-linear-gradient(to bottom, #111, #111 2px, transparent 2px, transparent 4px);
            box-shadow: inset 0 0 5px rgba(0,0,0,1);
        }

        /* === CONTEÚDO DA TELA (RIDDLE) === */
        #tv-content { z-index: 2; width: 100%; max-height: 100%; overflow: hidden; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .badge { font-size: clamp(12px, 3vw, 16px); font-weight: bold; color: var(--text-ink); margin-bottom: 10px; text-transform: uppercase; border-bottom: 2px solid rgba(43,23,6,0.3); padding-bottom: 5px; }
        .story-text { font-size: clamp(14px, 4vw, 18px); line-height: 1.5; font-weight: bold; color: var(--text-ink); text-shadow: 0 0 2px rgba(43,23,6,0.3); }
        .instruction { font-size: 10px; margin-top: auto; padding-top: 15px; text-transform: uppercase; font-weight: bold; color: rgba(43,23,6,0.6); animation: pulse 2s infinite alternate; }
        @keyframes pulse { from { opacity: 0.3; } to { opacity: 1; } }

        /* === UI FIXAS (PAREDE E MESA) === */
        
        /* Top-Left: Ranking (Correção do box desfocado) */
        .ranking-box {
            position: absolute; top: 15px; left: 15px; /* integrated into mahogany wall */
            background: rgba(255,255,255,0.05);
            border: 2px solid #444; padding: 6px 12px; border-radius: 4px;
            color: #ccc; font-weight: bold; font-size: 11px; z-index: 50;
            cursor: pointer; display: flex; align-items: center; gap: 6px;
            box-shadow: 2px 4px 6px rgba(0,0,0,0.5);
        }
        .ranking-box span { font-family: sans-serif; font-weight: normal; }

        /* Bottom-Right: Placa da Carteira (Wallet placeholder) */
        .wallet-box {
            position: absolute; bottom: 15px; right: 15px; /* integrated into mahogany desk */
            background: #2b1706; /* integrated with desk color */
            border: 2px solid #4a3b32; padding: 10px 18px; border-radius: 4px;
            color: var(--screen-amber); font-weight: bold; font-size: 11px; z-index: 50;
            cursor: pointer; display: flex; align-items: center; gap: 6px;
            box-shadow: 2px 4px 6px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }

        /* ELEMENTOS AMBIENTE NA MESA */
        .glass-drink {
            position: absolute; bottom: 20px; left: 20px;
            width: 50px; height: 60px;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 40%);
            border: 2px solid #555; border-radius: 2px 2px 10px 10px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,0,0,0.4);
            display: flex; justify-content: center; align-items: center; z-index: 5;
        }
        .drink { width: 90%; height: 60%; background: #995c2b; position: absolute; bottom: 4px; border-radius: 0 0 8px 8px; box-shadow: inset 0 -3px 5px rgba(0,0,0,0.4); }
        .ice-cube { width: 10px; height: 10px; background: #eee; position: absolute; top: 15px; left: 15px; border-radius: 1px; opacity: 0.7; transform: rotate(10deg); box-shadow: 1px 1px 2px rgba(0,0,0,0.3); }

        .map {
            position: absolute; bottom: 15px; left: 80px;
            width: 130px; height: 100px;
            background: #e1d5ba; padding: 10px;
            border-radius: 2px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,0,0,0.3);
            border: 1px dashed #a1a1a1;
            display: flex; justify-content: center; align-items: center;
            z-index: 5; transform: rotate(-5deg);
        }
        .map span { color: #555; font-size: 9px; }

        /* Botão Seta (Drunk-Proof) */
        .btn-next {
            position: absolute; bottom: 70px; right: 20px;
            background: rgba(0,0,0,0.8); color: var(--phosphor-white); 
            border: 2px solid #555;
            width: 45px; height: 45px; border-radius: 50%;
            font-size: 20px; cursor: pointer; z-index: 50;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8); transition: all 0.1s;
        }
        .btn-next:active { transform: scale(0.9); background: #333; }

        /* SCROLLBAR OCULTA NO TV */
        #tv-content::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

<div class="ambient-glow"></div>

<div class="ranking-box">i <span>RANKING DETETIVES</span></div>

<div class="tv-model">
    <div class="tv-screen-bezel">
        <div class="tv-crt-glass" onclick="toggleScreen()">
            <div class="scanlines"></div>
            <div id="static-noise"></div>
            
            <div id="tv-content">
                <div class="badge" id="tv-badge">MISTÉRIO #01</div>
                <div class="story-text" id="tv-text">Aquecendo tubo de imagem...</div>
                <div class="instruction">Toque na tela</div>
            </div>
        </div>
    </div>
    
    <div class="tv-panel">
        <div class="knob" style="transform: rotate(45deg);"></div>
        <div class="knob" style="transform: rotate(-30deg);"></div>
        <div class="speaker-grill"></div>
    </div>
</div>

<div class="wallet-box">DETETIVE_#042</div>

<div class="glass-drink">
    <div class="drink"></div>
    <div class="ice-cube"></div>
    <div class="ice-cube" style="top:25px; left:25px; transform:rotate(-15deg);"></div>
</div>

<div class="map">
    <span>MAPA DO ASILO - SEÇÃO CONFIDENCIAL</span>
</div>

<button class="btn-next" onclick="promptNextCard()">→</button>

<script>
    // === BANCO DE DADOS (35 HISTÓRIAS NOIR/PORRADA INTEGRADO) ===
    const database = [
        { title: "A Conta do Bar", enigma: "O homem entrou no bar e pediu água. O barman apontou uma arma. O homem sorriu e saiu. O que aconteceu?", solution: "O homem estava com soluço terrível. O barman percebeu e sacou a arma para dar um grande susto nele. O susto curou o soluço instantaneamente. Ele agradeceu a 'cura' e saiu feliz." },
        { title: "O Gelo no Asilo", enigma: "Enforcado no teto numa sala trancada, sem móveis. Abaixo dele, apenas uma poça de água.", solution: "Ele subiu em cima de um grande bloco de gelo para colocar a corda. O gelo derreteu, ele morreu enforcado, e o gelo virou poça." },
        { title: "A Poça Misteriosa", enigma: "Romeu e Julieta foram encontrados mortos no chão do quarto, com cacos de vidro e água ao redor.", solution: "Eram peixes dourados. O vento (ou gato) pulou pela janela aberta e derrubou o aquário, quebrando-o. Os peixes morreram sem água." },
        // ... (resto das 35 histórias integradas aqui)
    ];

    let state = { currentIndex: -1, isShowingSolution: false };

    // --- ELEMENTOS ---
    const textEl = document.getElementById('tv-text');
    const badgeEl = document.getElementById('tv-badge');
    const noiseEl = document.getElementById('static-noise');

    // --- LÓGICA DE TRANSIÇÃO TV ---
    function toggleScreen() {
        if(state.currentIndex === -1) return;
        
        // Efeito TV estática / Chuvisco "frufru"
        noiseEl.classList.add('active');
        
        setTimeout(() => {
            state.isShowingSolution = !state.isShowingSolution;
            renderContent();
            noiseEl.classList.remove('active');
        }, 120); // Tempo do "glitch"
    }

    function promptNextCard() {
        // Confirmação nativa (sem som) para evitar erros do detetive drunk-proof
        if (confirm("Mudar de canal e ver o próximo mistério CONFIDENCIAL?")) {
            noiseEl.classList.add('active');
            setTimeout(() => {
                state.isShowingSolution = false;
                pickRandomCard();
                noiseEl.classList.remove('active');
            }, 120);
        }
    }

    function pickRandomCard() {
        let newIndex = state.currentIndex;
        while(newIndex === state.currentIndex) {
            newIndex = Math.floor(Math.random() * database.length);
        }
        state.currentIndex = newIndex;
        renderContent();
        save();
    }

    function renderContent() {
        if(state.currentIndex === -1) { pickRandomCard(); return; }
        
        const data = database[state.currentIndex];
        const caseNum = (state.currentIndex + 1).toString().padStart(2, '0');
        
        if (!state.isShowingSolution) {
            badgeEl.innerText = `MISTÉRIO #${caseNum}`;
            textEl.innerText = data.enigma;
        } else {
            badgeEl.innerText = `SOLUÇÃO #${caseNum}`;
            textEl.innerText = data.solution;
        }
    }

    // --- PERSISTÊNCIA ---
    function save() { localStorage.setItem('mystery_tv_hyperreal_v1', JSON.stringify(state)); }
    function load() {
        let saved = localStorage.getItem('mystery_tv_hyperreal_v1');
        if (saved) {
            state = JSON.parse(saved);
            renderContent();
        } else {
            pickRandomCard();
        }
    }

    window.onload = load;
</script>
</body>
</html>
